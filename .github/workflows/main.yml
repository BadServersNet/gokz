name: CI

env:
  SM_VERSION: "1.11"
  S3_VERSION: "0.2.0"

on:
  push:
    branches: [ master, dev ]
    tags: [ '*' ]
  pull_request:
    branches: [ master, dev ]

  # Allows this workflow to be run manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest

    steps:
      # Checks-out the repository under $GITHUB_WORKSPACE
      - uses: actions/checkout@v4

      - name: version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "GOKZ_VERSION=$(git describe --tags --exact-match 2> /dev/null || git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: compile
        run: |
          mkdir sm
          cd sm
          curl -sL "https://sourcemod.net/latest.php?os=linux&version=${{env.SM_VERSION}}" | tar x -zf -
          cp -r ../addons .
          curl -sfL -o sm-s3.zip "https://github.com/BadServersNet/sm-s3/releases/download/v${{env.S3_VERSION}}/sm-s3-v${{env.S3_VERSION}}-linux.zip"
          python3 -m zipfile -e sm-s3.zip sm-s3
          cp sm-s3/addons/sourcemod/scripting/include/s3.inc addons/sourcemod/scripting/include/s3.inc
          cd ./addons/sourcemod/scripting
          echo "#define GOKZ_VERSION \"${GOKZ_VERSION}\"" > include/gokz/version.inc
          for file in gokz-*.sp; do ./spcomp $file; done;
          cd ../../../../
          mkdir -p addons/sourcemod/plugins
          mv sm/addons/sourcemod/scripting/gokz-*.smx addons/sourcemod/plugins
          mkdir -p addons/sourcemod/extensions addons/sourcemod/configs/s3
          cp sm/sm-s3/addons/sourcemod/extensions/s3.ext.so addons/sourcemod/extensions
          cp sm/sm-s3/addons/sourcemod/configs/s3/ca-bundle.crt addons/sourcemod/configs/s3
          
      - name: upload-full
        uses: actions/upload-artifact@v4
        with:
          name: GOKZ-v${{ env.GOKZ_VERSION }}
          path: |
            .
            !sm*
            !*.md
            !.github*
            !.git*
            !LICENSE
            !addons/sourcemod/scripting*
            !*.zip
            !*.fgd
          
      - name: upload-upgrade
        uses: actions/upload-artifact@v4
        with:
          name: GOKZ-v${{ env.GOKZ_VERSION }}-upgrade
          path: |
            .
            !sm*
            !*.md
            !.github*
            !.git*
            !LICENSE
            !addons/sourcemod/scripting*
            !cfg*
            !*.zip
            !*.fgd

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: package
        run: |
          cd artifacts
          for dir in GOKZ-v*; do (cd "$dir" && zip -qr "../$dir.zip" .); done

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/GOKZ-v*.zip --repo "${{ github.repository }}" --title "GOKZ ${{ github.ref_name }}" --generate-notes
